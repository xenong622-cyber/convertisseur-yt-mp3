<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Rounded square clip -->
    <clipPath id="bg-clip">
      <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180"/>
    </clipPath>
    <!-- Subtle gradient for depth -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283444"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <!-- Red gradient for play button -->
    <linearGradient id="red-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <g clip-path="url(#bg-clip)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg-grad)"/>
    <!-- Subtle border -->
    <rect x="4" y="4" width="1016" height="1016" rx="176" ry="176" fill="none" stroke="#374151" stroke-width="4"/>
  </g>

  <!-- Circular disc behind play button -->
  <circle cx="512" cy="480" r="260" fill="#111827" opacity="0.6"/>

  <!-- Play button triangle -->
  <g filter="url(#shadow)">
    <polygon points="430,350 430,610 660,480" fill="url(#red-grad)"/>
  </g>

  <!-- Audio waves (right side, emerging from play button) -->
  <g stroke="#ef4444" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M670,420 Q710,480 670,540"/>
    <path d="M710,380 Q770,480 710,580"/>
    <path d="M750,345 Q830,480 750,615"/>
  </g>

  <!-- Music note (bottom right corner) -->
  <g transform="translate(720, 700)" filter="url(#shadow)">
    <!-- Note head -->
    <ellipse cx="0" cy="60" rx="42" ry="32" fill="#ef4444" transform="rotate(-20, 0, 60)"/>
    <!-- Stem -->
    <line x1="36" y1="52" x2="36" y2="-60" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
    <!-- Flag -->
    <path d="M36,-60 Q80,-40 50,0" stroke="#ef4444" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- App name hint: small "YT" text badge -->
  <g transform="translate(200, 720)">
    <rect x="0" y="0" width="120" height="56" rx="12" ry="12" fill="#ef4444"/>
    <text x="60" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="34" fill="#ffffff" letter-spacing="2">YT</text>
  </g>
</svg>